# Validate both coordinated fix branches; publish only after merging to main.
name: Frontend CI and GitHub Pages

on:
  push:
    branches: [main, fix]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Require public deployment configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY || vars.VITE_API_KEY }}
        run: |
          node --input-type=module -e '
            for (const name of ["VITE_API_BASE", "VITE_API_KEY"]) {
              if (!process.env[name]?.trim()) throw new Error(`${name} must be configured before deployment`);
            }
            const url = new URL(process.env.VITE_API_BASE);
            if (url.protocol !== "https:") throw new Error("Production API must use HTTPS");
          '
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://api.example' }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY || vars.VITE_API_KEY || 'ci-gameplay-key' }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
